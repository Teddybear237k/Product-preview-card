<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Product preview card component</title>
</head>

<body>
    <main class="page-shell">
        <article class="product-card">
            <section class="card-image">
                <picture>
                    <source media="(max-width: 720px)" srcset="images/image-product-mobile.jpg">
                    <img src="images/image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum bottle">
                </picture>
            </section>

            <section class="card-details">
                <span class="product-category">Perfume</span>
                <h1>Gabrielle Essence Eau De Parfum</h1>
                <p class="product-description">
                    A floral, solar and voluptuous interpretation composed by Olivier Polge,
                    Perfumer-Creator for the House of CHANEL.
                </p>

                <div class="price-panel">
                    <strong class="current-price">$149.99</strong>
                    <span class="old-price">$169.99</span>
                </div>

                <button class="add-to-cart" type="button">
                    <img src="images/icon-cart.svg" alt="Cart icon" aria-hidden="true">
                    Add to Cart
                </button>
            </section>
        </article>
    </main>
</body>

</html>
