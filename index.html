<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Product preview card component</title>
</head>

<body>
    <main class="page-shell">
        <div class="card-slot">
            <article class="product-card">
                <div class="card-image">
                    <img src="images/image-product-desktop.jpg"
                        srcset="images/image-product-mobile.jpg 600w, images/image-product-desktop.jpg 1200w"
                        sizes="(min-width: 500cqi) 50cqi, 100cqi" alt="Gabrielle Essence Eau De Parfum bottle">
                </div>

                <div class="card-details">
                    <span class="product-category">Perfume</span>
                    <h1>Gabrielle Essence Eau De Parfum</h1>
                    <p class="product-description">
                        A floral, solar and voluptuous interpretation composed by Olivier Polge,
                        Perfumer-Creator for the House of CHANEL.
                    </p>

                    <div class="price-panel">
                        <strong class="current-price">$149.99</strong>
                        <s class="old-price"><span class="sr-only">Original price </span>$169.99</s>
                    </div>

                    <button class="add-to-cart" type="button">
                        <img src="images/icon-cart.svg" alt="" aria-hidden="true">
                        Add to Cart
                    </button>
                </div>
            </article>
        </div>
    </main>
</body>

</html>
